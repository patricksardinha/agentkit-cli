<svg width="480" height="120" viewBox="0 0 480 120" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AgentKit CLI</title>
<desc>Logo AgentKit avec icône géométrique et nom du projet</desc>

<!-- Ensemble centré : logo (80px) + gap (16px) + texte (~220px) = ~316px, début à x=82 -->

<!-- Logo hexagonal centré verticalement à y=60, x=82+40=122 -->
<g transform="translate(122, 60)">
  <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="-26" x2="0" y2="-44" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>
  <line x1="22" y1="-13" x2="38" y2="-22" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>
  <line x1="22" y1="13" x2="38" y2="22" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>
  <line x1="0" y1="26" x2="0" y2="44" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>
  <line x1="-22" y1="13" x2="-38" y2="22" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>
  <line x1="-22" y1="-13" x2="-38" y2="-22" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>
  <circle cx="0" cy="0" r="5" fill="#7C3AED"/>
  <circle cx="0" cy="-26" r="3" fill="#7C3AED" opacity="0.8"/>
  <circle cx="22" cy="-13" r="3" fill="#7C3AED" opacity="0.8"/>
  <circle cx="22" cy="13" r="3" fill="#7C3AED" opacity="0.8"/>
  <circle cx="0" cy="26" r="3" fill="#7C3AED" opacity="0.8"/>
  <circle cx="-22" cy="13" r="3" fill="#7C3AED" opacity="0.8"/>
  <circle cx="-22" cy="-13" r="3" fill="#7C3AED" opacity="0.8"/>
</g>

<!-- Texte : commence à x=82+80+16=178, baseline à y=76 -->
<text x="178" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-2">
  <tspan fill="#7C3AED">Agent</tspan><tspan fill="#7C3AED" opacity="0.5">Kit</tspan>
</text>

</svg>
